<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autoavaliação criada · Coordenação · Mobile 390 × 844</title>

  <!-- Favicon adaptativo oficial -->
  <link rel="icon" type="image/svg+xml" href="../assets/favicon-light.svg" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/svg+xml" href="../assets/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
  <link rel="alternate icon" href="../assets/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --color-bg-canvas: #f5f8fc;
      --color-bg-card: #ffffff;
      --color-border-subtle: #d9e4f2;
      --color-border-divider: #eef3f9;
      --color-text-main: #172b4d;
      --color-text-muted: #60758b;
      --color-text-subtle: #8194aa;
      --color-primary: #2563eb;
      --color-primary-light: #e8f1ff;
      --color-success: #16a34a;
      --color-success-light: #e8f7ee;
    }

    /* Ocultar barra de rolagem visual mantendo a rolagem ativa em todo o container mobile */
    * {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    *::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--color-bg-canvas);
      color: var(--color-text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Container do Mockup Mobile: 390px × 844px padrão */
    .mobile-screen-wrapper {
      width: 390px;
      min-width: 390px;
      max-width: 390px;
      height: 844px;
      min-height: 844px;
      max-height: 844px;
      background-color: var(--color-bg-canvas);
      border-radius: 36px;
      border: 1px solid var(--color-border-subtle);
      box-shadow: 0 16px 40px rgba(20, 51, 97, 0.12);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    @media (max-width: 480px) {
      body {
        padding: 0;
      }
      .mobile-screen-wrapper {
        width: 100%;
        min-width: 0;
        max-width: 100%;
        height: 100vh;
        min-height: 100vh;
        max-height: 100vh;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }
    }

    /* Cabeçalho Superior Mobile (72px) - Idêntico a turmas.html */
    .mobile-header {
      width: 100%;
      height: 72px;
      background-color: var(--color-bg-card);
      border-bottom: 1px solid var(--color-border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 10;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background-color: var(--color-primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
    }

    .brand-titles {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-text {
      font-size: 14px;
      font-weight: 700;
      color: var(--color-text-main);
      line-height: 1.2;
    }

    .brand-badge {
      font-size: 8.5px;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .header-notification-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--color-border-subtle);
      background-color: var(--color-bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-muted);
      cursor: pointer;
      position: relative;
      text-decoration: none;
      transition: background-color 0.15s ease;
    }

    .header-notification-btn:hover {
      background-color: #f8fafc;
    }

    .notification-dot {
      position: absolute;
      top: 8px;
      right: 9px;
      width: 7px;
      height: 7px;
      background-color: var(--color-primary);
      border: 1.5px solid var(--color-bg-card);
      border-radius: 50%;
    }

    /* Conteúdo Principal */
    .screen-content {
      scrollbar-width: none;
      -ms-overflow-style: none;
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-bottom: 88px; /* espaço para o rodapé */
    }

    .success-center-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin-top: 24px;
    }

    /* Ícone de Sucesso */
    .success-outer-circle {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background-color: var(--color-success-light);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .success-inner-circle {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: #ffffff;
      border: 1.5px solid var(--color-success);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .success-check-icon {
      width: 26px;
      height: 26px;
      color: var(--color-success);
    }

    /* Mensagem Principal */
    .success-main-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-text-main);
      text-align: center;
      letter-spacing: -0.2px;
      margin-bottom: 28px;
    }

    /* Cartão de Dados da Turma */
    .class-summary-card {
      width: 100%;
      background-color: var(--color-bg-card);
      border: 1px solid var(--color-border-subtle);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(20, 51, 97, 0.04);
    }

    .class-top-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .class-avatar-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background-color: var(--color-primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-primary);
      flex-shrink: 0;
    }

    .class-meta-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .class-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--color-text-main);
    }

    .class-details-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .class-etapa {
      font-size: 11px;
      color: var(--color-text-muted);
    }

    .class-students {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 500;
      color: var(--color-text-muted);
    }

    .card-divider {
      height: 1px;
      background-color: var(--color-border-divider);
      width: 100%;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 2px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--color-success);
      flex-shrink: 0;
    }

    .status-text {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--color-success);
    }

    /* Botão Voltar às Autoavaliações */
    .btn-voltar-autoavaliacoes {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 46px;
      background-color: var(--color-primary);
      color: #ffffff;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: none;
      margin-top: 24px;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .btn-voltar-autoavaliacoes:hover {
      background-color: #1d4ed8;
    }

    .btn-voltar-autoavaliacoes:active {
      transform: scale(0.99);
    }

    /* Barra de Navegação Inferior (Mobile) - Idêntica a turmas.html */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 72px;
      background-color: var(--color-bg-card);
      border-top: 1px solid var(--color-border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 20;
    }

    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-decoration: none;
      color: var(--color-text-muted);
      flex: 1;
      height: 100%;
      position: relative;
      transition: color 0.15s ease;
    }

    .nav-tab.active {
      color: var(--color-primary);
      font-weight: 600;
    }

    .nav-indicator-bar {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 3px;
      background-color: var(--color-primary);
      border-radius: 0 0 3px 3px;
    }

    .nav-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
    }

    .nav-label {
      font-size: 10px;
      line-height: 1;
    }
  </style>
</head>
<body>

  <div class="mobile-screen-wrapper">

    <!-- Cabeçalho Mobile: Coordenação (Idêntico a turmas.html) -->
    <header class="mobile-header">
      <a href="painel-inicial-coordenacao-mobile.html" class="brand-section">
        <div class="brand-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <main class="screen-content">

      <div class="success-center-block">

        <div class="success-outer-circle" aria-hidden="true">

        <h1 class="success-main-title">Autoavaliação criada com sucesso</h1>

        <!-- Cartão com Dados da Turma e Confirmação -->
        <article class="class-summary-card" aria-label="Detalhes da turma confirmada">
          <div class="class-top-row">
            <div class="class-avatar-box" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>

            </div>
            <div class="class-meta-group">
              <h2 class="class-title">6º ano A</h2>
              <div class="class-details-row">
                <span class="class-etapa">Ensino Fundamental II</span>
                <div class="class-students">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                  </svg>
                  <span>28 estudantes</span>
                </div>
              </div>
            </div>
          </div>

          <div class="card-divider" aria-hidden="true"></div>

          <div class="status-row">
            <span class="status-dot" aria-hidden="true"></span>
            <span class="status-text">Autoavaliação criada com sucesso</span>
          </div>
        </article>
      </div>

      <!-- Botão Voltar às Autoavaliações -->
      <a href="autoavaliacoes-turma-6ano-a.html" class="btn-voltar-autoavaliacoes" aria-label="Voltar para a lista de autoavaliações">
        <span>Voltar às Autoavaliações</span>
      </a>

    </main>

    <!-- Barra de Navegação Inferior (Mobile) - Idêntica a turmas.html -->
    <nav class="bottom-nav" aria-label="Navegação principal">
      <!-- 1. Início -->
      <a href="painel-inicial-coordenacao-mobile.html" class="nav-tab">
        <div class="nav-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.5 8.333L10 2.5l7.5 5.833v8.334c0 .46-.373.833-.833.833H12.5v-5.833H7.5v5.833H3.333c-.46 0-.833-.373-.833-.833V8.333z"/>
          </svg>
        </div>
        <span class="nav-label">Início</span>
      </a>

      <!-- 2. Alertas -->
      <a href="sistema-alerta-precoce.html" class="nav-tab">
        <div class="nav-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 6.67c0-2.76-2.24-5-5-5s-5 2.24-5 5c0 5.83-2.5 5.83-2.5 7.5h15c0-1.67-2.5-1.67-2.5-7.5z"/>
            <path d="M8.33 17.5h3.34"/>
          </svg>
        </div>
        <span class="nav-label">Alertas</span>
      </a>

      <!-- 3. Turmas (Ativo) -->
      <a href="turmas.html" class="nav-tab active" aria-current="page">
        <span class="nav-indicator-bar" aria-hidden="true"></span>
        <div class="nav-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 5.833v11.667"/>
            <path d="M2.5 15c-.46 0-.833-.373-.833-.833V3.333C1.667 2.873 2.04 2.5 2.5 2.5h4.167C8.508 2.5 10 3.992 10 5.833c0-1.841 1.492-3.333 3.333-3.333h4.167c.46 0 .833.373.833.833v10.834c0 .46-.373.833-.833.833h-5c-1.381 0-2.5 1.12-2.5 2.5 0-1.38-1.119-2.5-2.5-2.5H2.5z"/>
          </svg>
        </div>
        <span class="nav-label">Turmas</span>
      </a>

      <!-- 4. Agregadores -->
      <a href="dashboard-agregador-visao-central.html" class="nav-tab">
        <div class="nav-icon" aria-hidden="true">

        <span class="nav-label">Agregadores</span>

      <!-- 5. Perfil -->

          </svg>
        </div>
        <span class="nav-label">Perfil</span>
      </a>
    </nav>

  </div>

</body>
</html>
