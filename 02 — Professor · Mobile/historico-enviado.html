<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico Enviado · Professor · Educar &amp; Aprender</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon-light.svg" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon-dark.svg" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-primary: #2563eb;
      --color-primary-hover: #1d4ed8;
      --color-primary-light: #e8f1ff;
      --color-bg-canvas: #f5f8fc;
      --color-bg-card: #ffffff;
      --color-text-main: #172b4d;
      --color-text-muted: #60758b;
      --color-border: #d8e4f3;
      --color-border-subtle: #d9e4f2;
      --color-positive: #16a34a;
      --color-positive-bg: #e8f7ee;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 14px;
      --radius-xl: 16px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--color-bg-canvas);
      color: var(--color-text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .mobile-screen-wrapper {
      width: 390px;
      min-width: 390px;
      max-width: 390px;
      height: 844px;
      min-height: 844px;
      max-height: 844px;
      background-color: var(--color-bg-canvas);
      border-radius: 36px;
      border: 1px solid var(--color-border-subtle);
      box-shadow: 0 16px 40px rgba(20, 51, 97, 0.12);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    @media (max-width: 480px) {
      body {
        padding: 0;
      }
      .mobile-screen-wrapper {
        width: 100%;
        min-width: 0;
        max-width: 100%;
        height: 100vh;
        min-height: 100vh;
        max-height: 100vh;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }
    }

    .mobile-header {
      width: 100%;
      height: 72px;
      background-color: var(--color-bg-card);
      border-bottom: 1px solid var(--color-border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 10;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background-color: var(--color-primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.25;
      color: var(--color-text-main);
    }

    .brand-category {
      font-size: 9px;
      font-weight: 600;
      line-height: 1.44;
      letter-spacing: 0.5px;
      color: var(--color-primary);
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-icon-btn {
      width: 42px;
      height: 42px;
      background-color: var(--color-bg-card);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      text-decoration: none;
      color: var(--color-text-muted);
      transition: background-color 0.15s ease, border-color 0.15s ease;
      padding: 0;
    }

    .header-icon-btn:hover {
      background-color: #f8fafc;
      border-color: #c7d7eb;
      color: var(--color-primary);
    }

    .notif-badge-dot {
      position: absolute;
      left: 27px;
      top: 6px;
      width: 7px;
      height: 7px;
      background: var(--color-primary);
      border-radius: 50%;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 98px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      scrollbar-width: none;
    }

    .main-content::-webkit-scrollbar {
      display: none;
    }

    .success-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 0;
      margin-bottom: 24px;
      flex-shrink: 0;
    }

    .success-circle-outer {
      width: 102px;
      height: 102px;
      border-radius: 50%;
      background-color: var(--color-positive-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .success-circle-inner {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: #ffffff;
      border: 2px solid var(--color-positive);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .success-title {
      font-size: 21px;
      font-weight: 600;
      color: var(--color-text-main);
      text-align: center;
      margin-top: 20px;
      line-height: 1.25;
    }

    .confirmation-card {
      background-color: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 358px;
      flex-shrink: 0;
      box-sizing: border-box;
    }

    .confirmation-student-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .confirmation-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-color: var(--color-primary-light);
      color: var(--color-primary);
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .confirmation-student-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
      gap: 2px;
    }

    .confirmation-student-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--color-text-main);
      line-height: 1.25;
    }

    .confirmation-student-meta {
      font-size: 12px;
      color: var(--color-text-muted);
      font-weight: 500;
      line-height: 1.3;
    }

    .confirmation-divider {
      height: 1px;
      background-color: var(--color-border);
      width: 100%;
    }

    .confirmation-status-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot-green {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--color-positive);
      flex-shrink: 0;
    }

    .status-text-green {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-positive);
    }

    .btn-return {
      width: 100%;
      max-width: 358px;
      height: 48px;
      background-color: var(--color-text-muted);
      color: #ffffff;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: background-color 0.15s ease;
      margin-top: 24px;
      margin-bottom: 0;
      flex-shrink: 0;
      box-sizing: border-box;
    }

    .btn-return:hover {
      background-color: #475569;
    }

    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 80px;
      background-color: var(--color-bg-card);
      border-top: 1px solid var(--color-border-subtle);
      display: flex;
      align-items: flex-start;
      justify-content: space-around;
      padding-top: 8px;
      z-index: 20;
    }

    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-decoration: none;
      position: relative;
      width: 78px;
      color: var(--color-text-muted);
      cursor: pointer;
    }

    .nav-tab.active {
      color: var(--color-primary);
    }

    .nav-tab.active .nav-label {
      font-weight: 600;
    }

    .nav-indicator-bar {
      position: absolute;
      top: -8px;
      width: 36px;
      height: 3px;
      border-radius: 2px;
      background-color: var(--color-primary);
    }

    .nav-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-label {
      font-size: 10px;
      font-weight: 500;
      line-height: 1.4;
      text-align: center;
      white-space: nowrap;
    }

    .profile-modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(2px);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 92px;
      box-sizing: border-box;
    }

    .profile-modal-overlay:target {
      display: flex;
    }

    .profile-modal-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: default;
    }

    .profile-modal-card {
      position: relative;
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid var(--color-border);
      width: calc(100% - 32px);
      max-width: 358px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      z-index: 101;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .profile-modal-pointer {
      position: absolute;
      bottom: -8px;
      right: 36px;
      width: 16px;
      height: 16px;
      background: #ffffff;
      border-right: 1px solid var(--color-border);
      border-bottom: 1px solid var(--color-border);
      transform: rotate(45deg);
    }

    .profile-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .profile-modal-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--color-text-main);
    }

    .profile-modal-close {
      text-decoration: none;
      color: var(--color-text-muted);
      font-size: 16px;
      line-height: 1;
      padding: 4px;
    }

    .profile-modal-divider {
      height: 1px;
      background: var(--color-border-subtle);
      width: 100%;
    }

    .profile-modal-user {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-modal-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--color-primary-light);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .profile-modal-user-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .profile-modal-user-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--color-text-main);
    }

    .profile-modal-user-role {
      font-size: 11px;
      color: var(--color-text-muted);
    }

    .profile-modal-logout {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #fee2e2;
      color: #dc2626;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: background-color 0.15s ease;
    }

    .profile-modal-logout:hover {
      background: #fecaca;
    }
  </style>
</head>
<body>

  <main class="mobile-screen-wrapper">
    <header class="mobile-header">
      <a href="painel-inicial.html" class="brand-section" aria-label="Educar e Aprender - Início">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.333 16.25c0-1.15.933-2.083 2.084-2.083h11.25M5.417 1.667h11.25v16.666H5.417c-1.151 0-2.084-.932-2.084-2.083V3.75c0-1.15.933-2.083 2.084-2.083Z"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Educar &amp; Aprender</span>
          <span class="brand-category">Área do Professor</span>
        </div>
      </a>

      <div class="header-actions">
        <a href="mensagens.html" class="header-icon-btn" title="Mensagens" aria-label="Mensagens">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.5 4.583C2.5 3.433 3.433 2.5 4.583 2.5h6.667c1.15 0 2.083.933 2.083 2.083v4.167c0 1.15-.933 2.083-2.083 2.083H6.667L2.5 13.333V4.583z"/>
            <path d="M6.667 14.167h5.416c1.151 0 2.084-.933 2.084-2.084v-.416"/>
            <path d="M14.167 5.833h1.25c1.15 0 2.083.933 2.083 2.084v8.75l-3.333-2.084H12.5"/>
          </svg>
        </a>

        <a href="#notificacoes" class="header-icon-btn" title="Notificações" aria-label="Ver notificações">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 12.667C17 9.905 14.761 7.667 12 7.667s-5 2.238-5 5c0 5.833-2.5 5.833-2.5 7.5h15c0-1.667-2.5-1.667-2.5-7.5"/>
            <path d="M10.333 23.5h3.334"/>
          </svg>
          <span class="notif-badge-dot" aria-hidden="true"></span>
        </a>
      </div>
    </header>

    <div class="main-content">
      <div class="success-hero">
        <div class="success-circle-outer">
          <div class="success-circle-inner">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 6 9 17l-5-5"/>
            </svg>
          </div>
        </div>
        <h1 class="success-title">Histórico enviado</h1>
      </div>

      <div class="confirmation-card">
        <div class="confirmation-student-row">
          <div class="confirmation-avatar">AB</div>
          <div class="confirmation-student-info">
            <span class="confirmation-student-name">Ana Beatriz Ferraz</span>
            <span class="confirmation-student-meta">6º ano A · 1º bimestre de 2026</span>
          </div>
        </div>

        <div class="confirmation-divider"></div>

        <div class="confirmation-status-row">
          <span class="status-dot-green"></span>
          <span class="status-text-green">Enviada agora · histórico de evidências</span>
        </div>
      </div>

      <a href="historico-evidencias.html" class="btn-return">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15.833 10H4.167M10 15.833 4.167 10 10 4.167"/>
        </svg>
        <span>Voltar os Históricos</span>
      </a>
    </div>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <a href="painel-inicial.html" class="nav-tab">
        <div class="nav-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.5 8.333L10 2.5l7.5 5.833v8.334c0 .46-.373.833-.833.833H12.5v-5.833H7.5v5.833H3.333c-.46 0-.833-.373-.833-.833V8.333z"/>
          </svg>
        </div>
        <span class="nav-label">Início</span>
      </a>

      <a href="minhas-turmas.html" class="nav-tab active" aria-current="page">
        <div class="nav-indicator-bar" aria-hidden="true"></div>
        <div class="nav-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 5.833v11.667"/>
            <path d="M2.5 15c-.46 0-.833-.373-.833-.833V3.333C1.667 2.873 2.04 2.5 2.5 2.5h4.167C8.508 2.5 10 3.992 10 5.833c0-1.841 1.492-3.333 3.333-3.333h4.167c.46 0 .833.373.833.833v10.834c0 .46-.373.833-.833.833h-5c-1.381 0-2.5 1.12-2.5 2.5 0-1.38-1.119-2.5-2.5-2.5H2.5z"/>
          </svg>
        </div>
        <span class="nav-label">Turmas</span>
      </a>

      <a href="registro-selecionar-estudante.html" class="nav-tab">
        <div class="nav-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11.667 1.667H5c-.92 0-1.667.746-1.667 1.666v13.334c0 .92.746 1.666 1.667 1.666h10c.92 0 1.666-.746 1.666-1.666V6.667L11.667 1.667zm0 0v5h5M6.667 10.833h6.666M6.667 14.167h6.666"/>
          </svg>
        </div>
        <span class="nav-label">Registros</span>
      </a>

      <a href="#modal-perfil" class="nav-tab">
        <div class="nav-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="10" cy="6.667" r="3.333"/>
            <path d="M4.167 17.5v-1.667C4.167 12.612 6.778 10 10 10s5.833 2.612 5.833 5.833V17.5"/>
          </svg>
        </div>
        <span class="nav-label">Perfil</span>
      </a>
    </nav>

    <div id="modal-perfil" class="profile-modal-overlay">
      <a href="#" class="profile-modal-backdrop" aria-label="Fechar modal de perfil"></a>
      <div class="profile-modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-perfil-title">
        <div class="profile-modal-pointer" aria-hidden="true"></div>
        <div class="profile-modal-header">
          <h2 id="modal-perfil-title" class="profile-modal-title">Meu Perfil</h2>
          <a href="#" class="profile-modal-close" aria-label="Fechar modal">✕</a>
        </div>
        <div class="profile-modal-divider"></div>
        <div class="profile-modal-user">
          <div class="profile-modal-avatar">PR</div>
          <div class="profile-modal-user-info">
            <span class="profile-modal-user-name">Prof. Ricardo Silveira</span>
            <span class="profile-modal-user-role">Docente de Língua Portuguesa</span>
          </div>
        </div>
        <div class="profile-modal-divider"></div>
        <a href="login.html" class="profile-modal-logout">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7.5 17.5H4.167a1.667 1.667 0 0 1-1.667-1.667V4.167A1.667 1.667 0 0 1 4.167 2.5H7.5"/>
            <path d="M13.333 14.167L17.5 10l-4.167-4.167"/>
            <path d="M17.5 10H7.5"/>
          </svg>
          <span class="profile-modal-logout-text">Sair da conta</span>
        </a>
      </div>
    </div>
  </main>

</body>
</html>
